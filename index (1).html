<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RecreaPro</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f7fb;color:#182033}.app{display:flex;min-height:100vh}.side{width:245px;background:#12172a;color:#fff;padding:20px;position:fixed;inset:0 auto 0 0}.logo{font-size:25px;font-weight:800;margin-bottom:22px}.logo span{color:#8b6cff}.nav button{display:block;width:100%;border:0;background:transparent;color:#cdd2e2;text-align:left;padding:12px;border-radius:10px;margin:4px 0;font-size:15px}.nav button:hover,.nav button.active{background:#282e48;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:24px;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.top h1{margin:0;font-size:27px}.pill{background:#eae7ff;color:#5437dc;border-radius:99px;padding:8px 12px;font-weight:700;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e5e8ef;border-radius:16px;padding:17px;box-shadow:0 7px 25px #17213b0c}.stat b{display:block;font-size:28px;margin:5px 0}.muted{color:#697386;font-size:14px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:750;background:#6d4aff;color:#fff}.btn.secondary{background:#eeebff;color:#563bdc}.btn.gray{background:#f0f2f6;color:#31394b}.actions{display:flex;gap:8px;flex-wrap:wrap}.section{margin-top:18px}.section h2{font-size:19px;margin:0 0 12px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #edf0f4}.row:last-child{border-bottom:0}.badge{font-size:12px;font-weight:800;background:#eaf8f1;color:#14865a;border-radius:7px;padding:5px 8px}.list{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.tool h3{margin:8px 0}.form{display:grid;gap:12px}.form label{font-size:13px;font-weight:700}.form input,.form select,.form textarea{width:100%;padding:11px;border:1px solid #dce1ea;border-radius:9px}.modal{display:none;position:fixed;inset:0;background:#080b1499;z-index:20;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modalbox{background:#fff;border-radius:18px;padding:21px;width:min(620px,100%);max-height:90vh;overflow:auto}.close{float:right;border:0;border-radius:50%;width:32px;height:32px}.empty{text-align:center;color:#697386;padding:25px}.notice{background:#fff7e6;border:1px solid #f2d99a;padding:12px;border-radius:10px;font-size:13px}.mobile{display:none}
@media(max-width:850px){.side{display:none}.main{margin:0;width:100%;padding:16px 13px 78px}.grid{grid-template-columns:repeat(2,1fr)}.list{grid-template-columns:1fr}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e4e7ed;z-index:15;justify-content:space-around;padding:7px}.mobile button{border:0;background:transparent;font-size:11px;color:#697386}.mobile button.active{color:#6d4aff;font-weight:800}.top h1{font-size:23px}}
</style></head><body><div class="app"><aside class="side"><div class="logo">Recrea<span>Pro</span></div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><div class="muted">Operación de eventos</div><h1 id="title">Inicio</h1></div><span class="pill" id="conn">Conectando…</span></div><div id="content"></div></main><nav class="mobile" id="mobile"></nav></div><div class="modal" id="modal"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><script>
const SUPABASE_URL='https://mucrazzrtiszbkemcyba.supabase.co';const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11Y3JhenpydGlzemJrZW1jeWJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5OTY2MjAsImV4cCI6MjEwNDU3MjYyMH0.st8DQ6gflBMmPte2EBa7wuaAkJMOyn5ESi4cTCc211E';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const cats={"🎧 DJ":["Checklist de sonido","Entrada musical","Juegos con música","Bingo musical","Concurso de baile","Transiciones","Playlist por edades","Plan B de sonido","Animación con micrófono","Cierre musical"],"🤡 Shows infantiles":["Apertura del show","Magia sencilla","Globoflexia","Cuento participativo","Personajes","Coreografía infantil","Canciones","Competencias","Burbujas","Gran cierre"],"🎪 Ferias de pueblo":["Animación de tarima","Megafonía","Ronda de juegos","Concurso familiar","Presentación de artistas","Activación","Desfile","Trivia","Premiación","Cierre"],"🧸 Títeres":["Guion base","Voces","Presentación","Interacción","Historia corta","Moraleja","Preguntas al público","Música","Cambio de escena","Despedida"],"🎨 Pintucaritas":["Preparación de mesa","Higiene","Diseños rápidos","Mariposa","Tigre","Superhéroe","Princesa","Unicornio","Diseños por edad","Cierre de estación"],"🎤 Animadores":["Saludo inicial","Manejo de micrófono","Llamado al público","Rompehielos","Dinámica grupal","Concurso","Animación de fila","Improvisación","Manejo de imprevistos","Cierre"],"🎲 Juegos y recreación":["Rompehielos","Carrera de relevos","Estatuas","Simón dice","Pasa el aro","Trivia","Búsqueda","Competencia por equipos","Juego cooperativo","Gran final"],"🧊 Rompehielos":["Nombres con movimiento","Aplauso por zonas","Eco de palabras","Semáforo","Preguntas rápidas","La ola","Cambio de lugar","Reto de palmas","Parejas","Ronda express"],"🎙️ Presentador / MC":["Guion del evento","Presentación","Transiciones","Invitados","Control de tiempos","Anuncios","Micrófono","Protocolos","Plan B","Cierre formal"]};
let view='home',events=[];const $=x=>document.getElementById(x);function nav(){let a=[['home','🏠 Inicio'],['events','📅 Eventos'],['tools','🧰 Herramientas'],['materials','📦 Materiales'],['evidence','📸 Evidencias']];$('nav').innerHTML=a.map(x=>`<button class="${view==x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');$('mobile').innerHTML=a.slice(0,5).map(x=>`<button class="${view==x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}async function load(){let r=await sb.from('events').select('*').order('created_at',{ascending:false});if(r.error){$('conn').textContent='Sin conexión';$('conn').style.background='#ffe8ed';$('conn').style.color='#b72843';return}events=r.data||[];$('conn').textContent='☁ Conectado';render()}async function go(v){view=v;render();if(v==='events'||v==='home')await load()}function render(){nav();$('title').textContent={home:'Inicio',events:'Eventos',tools:'Herramientas',materials:'Materiales',evidence:'Evidencias'}[view];$('content').innerHTML=views[view]()}const views={home:()=>`<div class="grid"><div class="card stat">Eventos<b>${events.length}</b><span class="muted">en la nube</span></div><div class="card stat">Categorías<b>${Object.keys(cats).length}</b><span class="muted">con 10 ayudas cada una</span></div><div class="card stat">Ayudas<b>${Object.keys(cats).length*10}</b><span class="muted">para recreadores</span></div><div class="card stat">Estado<b>☁</b><span class="muted">base central</span></div></div><div class="section"><div class="card"><div class="top" style="margin:0"><div><h2>RecreaPro central</h2><span class="muted">Crea eventos y compártelos con tu equipo.</span></div><button class="btn" onclick="eventForm()">+ Crear evento</button></div></div></div><div class="section"><h2>Próximos eventos</h2><div class="card">${events.slice(0,5).map(eventRow).join('')||'<div class="empty">Aún no hay eventos en la nube.</div>'}</div></div>`,events:()=>`<div class="card"><div class="top" style="margin:0"><h2>Eventos compartidos</h2><button class="btn" onclick="eventForm()">+ Nuevo evento</button></div>${events.map(eventRow).join('')||'<div class="empty">Crea el primer evento.</div>'}</div>`,tools:()=>`<div class="list">${Object.entries(cats).map(([c,arr])=>`<div class="card"><h2 style="font-size:18px">${c}</h2>${arr.map((x,i)=>`<div class="row"><div><b>${i+1}.</b> ${x}</div><button class="btn gray" onclick="guide('${x.replace(/'/g,"\\'")}','${c.replace(/'/g,"\\'")}')">Ver</button></div>`).join('')}</div>`).join('')}</div>`,materials:()=>`<div class="card"><div class="top" style="margin:0"><h2>Materiales</h2><button class="btn" onclick="materialForm()">+ Registrar</button></div><div id="matList"><div class="empty">Cargando…</div></div></div>`,evidence:()=>`<div class="card"><div class="top" style="margin:0"><h2>Evidencias y novedades</h2><button class="btn" onclick="evidenceForm()">+ Registrar</button></div><div id="evList"><div class="empty">Cargando…</div></div></div>`};
function eventRow(e){return `<div class="row"><div><b>${esc(e.name)}</b><div class="muted">${esc(e.event_date||'Sin fecha')} · ${esc(e.place||'Sin lugar')} · ${esc(e.coordinator||'Sin coordinador')}</div></div><div class="actions"><span class="badge">${esc(e.status||'Borrador')}</span><button class="btn secondary" onclick="program('${e.id}')">Programa</button><button class="btn gray" onclick="share('${e.id}')">🔗 Compartir</button></div></div>`}
function eventForm(){openModal(`<h2>Crear evento</h2><div class="form"><label>Nombre<input id="en" placeholder="Festival Familiar"></label><label>Fecha<input id="ed" type="date"></label><label>Lugar<input id="ep" placeholder="Parque Central"></label><label>Coordinador<input id="ec" placeholder="Nombre"></label><label>Tipo<select id="et"><option>Recreación</option><option>Show infantil</option><option>Feria de pueblo</option><option>Corporativo</option></select></label><button class="btn" onclick="createEvent()">Guardar en la nube</button></div>`)}async function createEvent(){let p={name:$('en').value||'Evento sin nombre',event_date:$('ed').value||null,place:$('ep').value||null,coordinator:$('ec').value||null,event_type:$('et').value,status:'Borrador',program:defaultProgram()};let r=await sb.from('events').insert(p).select().single();if(r.error){alert('No se pudo guardar: '+r.error.message);return}closeModal();await load();go('events')}function defaultProgram(){return ['Saludo inicial','Acercamiento al público','Rompehielos','Juego de activación','Show / presentación','Pintucaritas','Títeres','DJ / baile','Concurso final','Cierre y despedida'].map((name,i)=>({order:i+1,name,duration:[10,10,15,20,25,30,20,30,15,10][i]+' min'}))}function program(id){let e=events.find(x=>x.id===id);let p=e?.program||defaultProgram();openModal(`<h2>Programa · ${esc(e?.name||'Evento')}</h2><p class="muted">Programa base para el Coordinador.</p>${p.map(x=>`<div class="row"><b>${x.order}. ${esc(x.name)}</b><span class="badge">${esc(x.duration)}</span></div>`).join('')}<br><button class="btn" onclick="closeModal()">Listo</button>`)}
function guide(x,c){openModal(`<h2>${esc(x)}</h2><p class="muted">${esc(c)}</p><div class="notice"><b>Cómo hacerlo bien</b><p>Prepara el espacio y materiales. Explica la actividad en frases cortas y haz una demostración. Mantén participación y seguridad. Adapta dificultad y duración al público. Cierra reconociendo la participación y enlaza con la siguiente actividad.</p></div>`)}
async function materialForm(){let opts=events.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');openModal(`<h2>Registrar material</h2><div class="form"><label>Evento<select id="me">${opts||'<option value="">Sin eventos</option>'}</select></label><label>Material<input id="mn" placeholder="Parlante, pinturas, títeres..."></label><label>Cantidad<input id="mq" type="number" min="1" value="1"></label><label>Estado<select id="ms"><option>Entregado</option><option>Devuelto</option><option>Con novedad</option></select></label><label>Notas<textarea id="mt"></textarea></label><button class="btn" onclick="saveMaterial()">Guardar</button></div>`)}async function saveMaterial(){let r=await sb.from('materials').insert({event_id:$('me').value||null,name:$('mn').value||'Material',quantity:+$('mq').value||1,status:$('ms').value,notes:$('mt').value});if(r.error)return alert(r.error.message);closeModal();render();loadMaterials()}async function loadMaterials(){let r=await sb.from('materials').select('*,events(name)').order('created_at',{ascending:false});$('matList').innerHTML=r.error?`<div class="empty">${esc(r.error.message)}</div>`:r.data.length?r.data.map(m=>`<div class="row"><div><b>${esc(m.name)}</b><div class="muted">${esc(m.events?.name||'Sin evento')} · Cantidad: ${m.quantity}</div></div><span class="badge">${esc(m.status)}</span></div>`).join(''):'<div class="empty">No hay materiales registrados.</div>'}async function evidenceForm(){let opts=events.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');openModal(`<h2>Registrar evidencia</h2><div class="form"><label>Evento<select id="xe">${opts||'<option value="">Sin eventos</option>'}</select></label><label>Tipo<select id="xt"><option>Evidencia de entrega</option><option>Foto de devolución</option><option>Video de devolución</option></select></label><label>Descripción<textarea id="xd" placeholder="Describe el estado del material"></textarea></label><label><input id="xn" type="checkbox"> Hay novedad</label><button class="btn" onclick="saveEvidence()">Guardar</button></div>`)}async function saveEvidence(){let r=await sb.from('evidence').insert({event_id:$('xe').value||null,evidence_type:$('xt').value,description:$('xd').value,novelty:$('xn').checked});if(r.error)return alert(r.error.message);closeModal();render();loadEvidence()}async function loadEvidence(){let r=await sb.from('evidence').select('*,events(name)').order('created_at',{ascending:false});$('evList').innerHTML=r.error?`<div class="empty">${esc(r.error.message)}</div>`:r.data.length?r.data.map(x=>`<div class="row"><div><b>${esc(x.evidence_type)}</b><div class="muted">${esc(x.events?.name||'Sin evento')} · ${esc(x.description||'Sin descripción')}</div></div><span class="badge">${x.novelty?'Con novedad':'Sin novedad'}</span></div>`).join(''):'<div class="empty">No hay evidencias.</div>'}function share(id){let url=location.href.split('#')[0]+'#evento='+encodeURIComponent(id);navigator.clipboard?.writeText(url);alert('Enlace copiado:\n'+url)}function openModal(x){$('modalBody').innerHTML=x;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}render();load();setTimeout(()=>{if(view==='materials')loadMaterials();if(view==='evidence')loadEvidence()},600);document.addEventListener('click',()=>{if(view==='materials')loadMaterials();if(view==='evidence')loadEvidence()});
</script></body></html>
